defaults:
  - data
  - _self_

embedding_dim: 256
action_dim: 76
predictor_hidden_dim: 512
# SIGReg weight λ — tune so pred_loss and reg_loss have a ~1:1 to 1:3 gradient magnitude ratio
lambda_reg: 2.0e-3
n_slices: 1024
t_max: 3.0
n_points: 17

batch_size: 1024
num_workers: 4
lr: 1.0e-2
weight_decay: 1.0e-2
max_epochs: 100
seed: 42

# cross_stay pairs only: first ECG of stay k → first ECG of stay k+1
pair_types: [cross_stay]

# Upweight positive class in BCE to counter label sparsity.
# onset ≈ 0.693/0.015 ≈ 46, resolution ≈ 0.693/0.035 ≈ 20 (derived from loss collapse values).
onset_pos_weight: 1.0
resolution_pos_weight: 1.0

wandb_project: lesaude-inverse
use_wandb: true
ckpt_path: checkpoints/inverse_.ckpt

# Manual resume: path to a `last.ckpt` from an interrupted run's run_dir
# (e.g. runs/runs/<date>/<time>/<run_id>/checkpoints/last.ckpt). Relative
# paths are resolved against the original cwd. Leave null for a fresh run
# (SLURM requeue resume is automatic and doesn't need this).
resume_ckpt: false
# False = full resume (optimizer/scheduler/epoch/RNG). True = load weights only.
resume_weights_only: false

evaluate:
  ckpt_path: archive/finetune_inverse.ckpt
  num_workers: 4
  n_bootstrap: 1000
  seed: 42
  mode: triage  # triage | monitoring
