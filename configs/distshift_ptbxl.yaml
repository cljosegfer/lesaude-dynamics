# Distribution Shift evaluation (papel/experiments.tex): a MIMIC-trained
# classifier (76-dim sigmoid output, no further finetuning) is applied to
# PTB-XL waveforms and scored only on the ICD-10 clusters that have a PTB-XL
# counterpart via src/dataset/scp_to_icd10_ptbxl.csv.
#
# Deliberately standalone rather than composing configs/data.yaml +
# configs/data_ptbxl.yaml — both define a `vocabulary_path` key for their own
# (different) label space, so composing them would collide.

embedding_dim: 256
batch_size: 1024

mimic_vocabulary_path: '/snfs2/josefernandes/datasets/lesaude/mimic-iv-ecg-monolith/icd_vocabulary_76.json'
ptbxl_lance_path: '/snfs2/josefernandes/datasets/lesaude/ptbxl-monolith/ptbxl.lance'
ptbxl_vocabulary_path: '/snfs2/josefernandes/datasets/lesaude/ptbxl-monolith/dx_vocabulary_ptbxl.json'

# high | medium | low — see src/dataset/icd10_crosswalk.py for what each tier means.
min_confidence: medium

evaluate:
  # A MIMIC-trained/finetuned checkpoint (76-dim head) — NOT a PTB-XL-finetuned
  # one, the whole point is testing transfer without further adaptation.
  # Override to compare model types, e.g.:
  #   ++evaluate.ckpt_path=archive/supervised_0.ckpt
  ckpt_path: archive/finetune_inverse.ckpt
  num_workers: 4
  n_bootstrap: 1000
  seed: 42
