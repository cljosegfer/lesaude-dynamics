defaults:
  - data_csn
  - _self_

embedding_dim: 256
batch_size: 1024
num_workers: 4
# Lower LR for finetuning, consistent with configs/finetune.yaml
lr: 1.0e-4
weight_decay: 1.0e-2
max_epochs: 100
seed: 42

# Base encoder to finetune from — the inverse-dynamics pretrained checkpoint
# (currently the only dynamics-pretrained checkpoint archived on disk).
pretrained_ckpt: archive/supervised_0.ckpt
# freeze_encoder=true  -> linear probe
# freeze_encoder=false -> full finetune
freeze_encoder: false

wandb_project: lesaude-finetune-csn
use_wandb: true
ckpt_path: checkpoints/finetune_csn_supervised.ckpt

# Manual resume: path to a `last.ckpt` from an interrupted run's run_dir
# (e.g. runs/runs/<date>/<time>/<run_id>/checkpoints/last.ckpt). Relative
# paths are resolved against the original cwd. Leave null for a fresh run
# (SLURM requeue resume is automatic and doesn't need this).
resume_ckpt: false
# False = full resume (optimizer/scheduler/epoch/RNG). True = load weights only.
resume_weights_only: false

# num_classes is not hardcoded here — scripts/finetune_csn.py and
# scripts/evaluate_csn.py read len(json.load(open(vocabulary_path))) at
# runtime (94 Dx classes as of the 2026-08 build).
evaluate:
  ckpt_path: archive/finetune_csn_supervised.ckpt
  num_workers: 4
  n_bootstrap: 1000
  seed: 42
