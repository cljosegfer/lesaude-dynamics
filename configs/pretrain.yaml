defaults:
  - data
  - _self_

pair_types: [cross_stay]
# k=1..12 cross-stay pairs (scripts/build_pairs_multistep.py), instead of the
# traditional pairs.lance (k=1 only). Logged to wandb as a plain hparam, so
# runs against either file are distinguishable there.
# pairs_path: ${pairs_multistep_path}

embedding_dim: 256
# Encoder: resnet1d (src/models/resnet1d.py, 3.98M params) | vit1d (src/models/vit1d.py, configured by vit:)
backbone: vit1d
# vit1d at batch_size 1024 pairs, 16-mixed, one RTX 3090 Ti (encoder params, peak memory, pairs/s):
#   dim 128, depth 4 (default)   0.87M  13.9 GiB  3,600  ~ ResNet1d's stem..layer3 (0.96M), the part that
#                                                        did not memorize in the forward runs
#   dim 128, depth 6             1.26M  20.2 GiB  2,500
#   dim 192, depth 4             1.89M  20.4 GiB  2,400
#   dim 192, depth 8 (ViT-XS)    3.67M  out of memory; fits with grad_checkpoint: true (4.9 GiB, 900 pairs/s)
# ResNet1d for reference: 14.7 GiB, 2,300 pairs/s (about the /scratch loader's rate).
vit:
  patch_size: 25        # samples per token: 50 ms at 500 Hz -> 200 tokens
  dim: 128
  depth: 4
  num_heads: 4
  mlp_ratio: 4.0
  grad_checkpoint: false
action_dim: 76
# false = ablation without actions: at is zeroed for every pair, so Dynϕ predicts ht+1 from ht alone (Projω(0) is
# a learned constant) and pretraining is label-free. The decoy probe then logs only eval/mse_ratio, scored at a = 0.
use_actions: false
predictor_hidden_dim: 512
# Decoys per family (same-count, extra-flip, prior) scored per val pair by the decoy probe (eval/decoy_*); 0 = off
decoy_probe_decoys: 16
# SIGReg weight λ — tune so pred_loss and reg_loss have a ~1:1 to 1:3 gradient magnitude ratio
lambda_reg: 5.0e-2
n_slices: 1024
t_max: 3.0
n_points: 17

batch_size: 1024
num_workers: 4
# Aggressive LR stable for the dynamics task (paper Appendix B)
lr: 1.0e-3
weight_decay: 1.0e-1
max_epochs: 405
seed: 42

wandb_project: lesaude-pretrain
use_wandb: true
ckpt_path: checkpoints/pretrain_zeroactions.ckpt
# Best-by-downstream-AUROC checkpoint, saved alongside the best-by-val/loss one
# above. Same weights-only ModelCheckpoint mechanism, monitoring
# eval/auroc__MultilabelAUROC_epoch (mode=max) instead.
ckpt_path_auroc: checkpoints/pretrain_zeroactions_auroc.ckpt

# Manual resume: path to a `last.ckpt` from an interrupted run's run_dir
# (e.g. runs/runs/<date>/<time>/<run_id>/checkpoints/last.ckpt). Relative
# paths are resolved against the original cwd. Leave null for a fresh run
# (SLURM requeue resume is automatic and doesn't need this).
resume_ckpt: false
# False = full resume (optimizer/scheduler/epoch/RNG). True = load weights only.
resume_weights_only: false

evaluate:
  ckpt_path: runs/runs/20261002/145831/c9ff326e7a8f/checkpoints/finetune_vit.ckpt # finetune_pretrain_auroc, finetune_pretrain_val
  num_workers: 4
  n_bootstrap: 1000
  seed: 42
  mode: triage  # triage | monitoring